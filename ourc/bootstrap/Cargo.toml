[package]
name = "ourc-bootstrap"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Builds the compiler tower and ourc from the hand-written hex seed, checking every stage against pinned hashes"
readme = "README.md"
keywords = ["bootstrap", "compiler", "reproducible", "trusting-trust"]
categories = ["development-tools", "compilers"]
# The tower sources ride along in tree/ (written by `ourc-bootstrap --vendor <repo> tree`); build.rs embeds them.
include = ["Cargo.toml", "build.rs", "src/**", "pins.txt", "tree/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]

[profile.release]
opt-level = 2
